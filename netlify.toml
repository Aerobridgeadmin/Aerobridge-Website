[build]
  publish = "."

# Clean URLs for all pages
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/history"
  to = "/history.html"
  status = 200

[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 200

[[redirects]]
  from = "/exam-preparation"
  to = "/exam-preparation.html"
  status = 200

[[redirects]]
  from = "/pricing"
  to = "/pricing.html"
  status = 200

[[redirects]]
  from = "/get-started"
  to = "/get-started.html"
  status = 200

[[redirects]]
  from = "/free-consultation"
  to = "/free-consultation.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/faq"
  to = "/faq.html"
  status = 200

# Redirects from the old Spanish URLs
[[redirects]]
  from = "/sobrenosotros"
  to = "/about"
  status = 301

[[redirects]]
  from = "/contacto"
  to = "/history"
  status = 301

[[redirects]]
  from = "/servicios"
  to = "/services"
  status = 301

[[redirects]]
  from = "/preparacion-examenes"
  to = "/exam-preparation"
  status = 301

[[redirects]]
  from = "/listadepreciosyservicios"
  to = "/pricing"
  status = 301

[[redirects]]
  from = "/como-empezar"
  to = "/get-started"
  status = 301

[[redirects]]
  from = "/consulta-gratis"
  to = "/free-consultation"
  status = 301

# Form success page
[[redirects]]
  from = "/success"
  to = "/contact.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
